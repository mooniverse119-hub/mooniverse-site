<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신청 완료</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--primary:#2F5BD3;--accent:#FFB648;--bg:#FFFFFF;--ink:#18191C;--sub:#5D6270;--surface:#F4F6FA;--line:#E3E6EC}
body{margin:0;font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;word-break:keep-all}
.result{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 20px}
.box{max-width:640px;text-align:center}
.check{width:72px;height:72px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 24px}
h1{font-size:clamp(26px,5vw,38px);margin:0}
p{margin:14px 0 0;color:var(--sub)}
.wiped{display:inline-block;margin-top:22px;padding:12px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.funnel{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:32px 0 8px;font-size:13.5px;font-weight:700}
.funnel span{padding:9px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.funnel span.now{background:var(--primary);color:#fff;border-color:var(--primary)}
.funnel i{align-self:center;font-style:normal;opacity:.4}
.btn{display:inline-block;margin-top:28px;padding:14px 24px;border-radius:999px;background:var(--primary);color:#fff;font-weight:700;text-decoration:none}
</style>
<!-- GA4 (Day 34): index.html과 같은 Google 태그 코드를 이 줄 바로 아래에 붙여 넣습니다. 이 페이지 조회 = 전환 완료 -->
<!-- Meta Pixel (Day 35) -->
</head>
<body>
<main class="result"><div class="box">
  <div class="check">✓</div>
  <h1>신청해 주셔서 감사합니다</h1>
  <p>이 페이지는 <b>성동 SESAC AI 활용 콘텐츠 마케터 과정 6기</b> 수강생이<br>랜딩페이지와 퍼널 구조, GA4 전환 측정을 연습하기 위해 만든 교육용 페이지입니다.</p>
  <p>수업용 브랜드이며, 실제 판매·가입·예약은 진행되지 않았습니다.</p>
  <div class="wiped">🔒 입력하신 정보는 어디에도 전송·저장되지 않았고, 이미 화면에서 지워졌습니다.</div>
  <div class="funnel" aria-label="이 페이지의 퍼널 구조">
    <span>광고·검색·SNS</span><i>→</i><span>랜딩페이지</span><i>→</i><span>신청</span><i>→</i><span class="now">지금 여기 (전환 완료)</span>
  </div>
  <a class="btn" href="./">처음 화면으로</a>
</div></main>
</body>
</html>
